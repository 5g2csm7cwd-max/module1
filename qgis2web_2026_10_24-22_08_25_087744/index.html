        <!-- 錯誤顯示：避免「一片空白」卻不知道原因 -->
        <script>
        window.addEventListener('error', function (e) {
            var el = document.getElementById('error-overlay');
            if (!el) return;
            var t = e.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
                el.style.display = 'block';
                el.textContent += '❌ 無法載入: ' + (t.src || t.href) + '\n';
            } else if (e.message) {
                el.style.display = 'block';
                el.textContent += '❌ ' + e.message + '  (' +
                    (e.filename || '') + ':' + (e.lineno || '') + ')\n';
            }
        }, true);
        </script>

            function removeEmptyRowsFromPopupContent(content, feature) {
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                var rows = tempDiv.querySelectorAll('tr');
                for (var i = 0; i < rows.length; i++) {
                    var td = rows[i].querySelector('td.visible-with-data');
                    var key = td ? td.id : '';
                    if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                        rows[i].parentNode.removeChild(rows[i]);
                    }
                }
                return tempDiv.innerHTML;
            }

            function addClassToPopupIfMedia(content, popup) {
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                var imgTd = tempDiv.querySelector('td img');
                if (imgTd) {
                    var src = imgTd.getAttribute('src');
                    if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                        popup._contentNode.classList.add('media');
                        var img = popup._contentNode.querySelector('td img');
                        if (img) {
                            if (img.complete && img.naturalHeight > 0) {
                                popup.update();
                            } else {
                                img.addEventListener('load', function () { popup.update(); });
                                img.addEventListener('error', function () { popup.update(); });
                            }
                        }
                    } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                        var audio = document.createElement('audio');
                        audio.controls = true;
                        audio.src = src;
                        imgTd.parentNode.replaceChild(audio, imgTd);
                        popup._contentNode.classList.add('media');
                        setTimeout(function () {
                            popup.setContent(tempDiv.innerHTML);
                            popup.update();
                        }, 10);
                    } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                        var video = document.createElement('video');
                        video.controls = true;
                        video.src = src;
                        video.style.width = "400px";
                        video.style.height = "300px";
                        video.style.maxHeight = "60vh";
                        video.style.maxWidth = "60vw";
                        imgTd.parentNode.replaceChild(video, imgTd);
                        popup._contentNode.classList.add('media');
                        video.addEventListener('loadedmetadata', function () { popup.update(); });
                        setTimeout(function () {
                            popup.setContent(tempDiv.innerHTML);
                            popup.update();
                        }, 10);
                    } else {
                        popup._contentNode.classList.remove('media');
                    }

                spiderfyDistanceMultiplier: 2
            });
            cluster_module1_with_coordinates_21.addLayer(layer_module1_with_coordinates_21);
            bounds_group.addLayer(layer_module1_with_coordinates_21);
            cluster_module1_with_coordinates_21.addTo(map);

            setBounds();

            // ===== 標籤綁定 =====
            var i = 0;
            layer_wek3_tut_points_19.eachLayer(function (layer) {
                layer.bindTooltip(
                    (layer.feature.properties['Locality'] !== null
                        ? '<div style="color:#323232;font-size:6pt;font-weight:bold;font-style:italic;font-family:\'Times New Roman\',sans-serif;">' + layer.feature.properties['Locality'] + '</div>'
                        : ''),
                    {permanent: true, offset: [0, -16], className: 'css_wek3_tut_points_19'}
                );
                labels.push(layer);
                totalMarkers += 1;
                layer.added = true;
                addLabel(layer, i);
                i++;
            });

            i = 0;
            layer_week2_tut_point_20.eachLayer(function (layer) {
                layer.bindTooltip(
                    (layer.feature.properties['place_name'] !== null
                        ? '<div style="color:#323232;font-size:6pt;font-weight:bold;font-style:italic;font-family:\'Times New Roman\',sans-serif;">' + layer.feature.properties['place_name'] + '</div>'
                        : ''),
                    {permanent: true, offset: [0, -16], className: 'css_week2_tut_point_20'}
                );
                labels.push(layer);
                totalMarkers += 1;
                layer.added = true;
                addLabel(layer, i);
                i++;
            });

            i = 0;
            layer_module1_with_coordinates_21.eachLayer(function (layer) {
                layer.bindTooltip(
                    (layer.feature.properties['Location_note'] !== null
                        ? '<div style="color:#323232;font-size:6pt;font-weight:bold;font-style:italic;font-family:\'Times New Roman\',sans-serif;">' + layer.feature.properties['Location_note'] + '</div>'
                        : ''),
                    {permanent: true, offset: [0, -16], className: 'css_module1_with_coordinates_21'}
                );
                labels.push(layer);
                totalMarkers += 1;
                layer.added = true;
                addLabel(layer, i);
                i++;
            });

            L.ImageOverlay.include({
                getBounds: function () { return this._bounds; }
            });

            resetLabels([layer_wek3_tut_points_19, layer_week2_tut_point_20, layer_module1_with_coordinates_21]);
            map.on("zoomend", function () {
                resetLabels([layer_wek3_tut_points_19, layer_week2_tut_point_20, layer_module1_with_coordinates_21]);
            });
            map.on("layeradd", function () {
                resetLabels([layer_wek3_tut_points_19, layer_week2_tut_point_20, layer_module1_with_coordinates_21]);
            });
            map.on("layerremove", function () {
                resetLabels([layer_wek3_tut_points_19, layer_week2_tut_point_20, layer_module1_with_coordinates_21]);
            });

            // 保險：資料都載入後再 fitBounds 到實際內容範圍
            try {
                if (bounds_group.getLayers().length > 0) {
                    var b = bounds_group.getBounds();
                    if (b.isValid()) {
                        map.fitBounds(b, {padding: [20, 20]});
                    }
                }
            } catch (e) { console.warn('fitBounds 失敗', e); }

        })();
        </script>
    </body>
</html>
